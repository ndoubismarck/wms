name: Build

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'debug'
        type: choice
        options:
          - info
          - warning
          - debug

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: PNPM Setup
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          
      - name: Go Setup
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build Frontend
        run: chmod +x ./frontend/web/scripts/build.sh && ./frontend/web/scripts/build.sh

      - name: Release Backend
        run: chmod +x ./scripts/release.sh && ./scripts/release.sh
